<!DOCTYPE html>
<html lang="id">
<head>

<title>Pesanan Berhasil</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{

}

body{

background:#F4F8FC;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.card{

background:white;
padding:50px;
width:550px;
border-radius:25px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.1);

}

.icon{

font-size:90px;
margin-bottom:20px;

}

h1{

color:#2563EB;
margin-bottom:20px;

}

p{

color:#64748B;
line-height:30px;
margin-bottom:35px;

}

.btn{

display:flex;
justify-content:center;
gap:20px;

}

.btn a{

text-decoration:none;
padding:15px 30px;
border-radius:12px;
font-weight:bold;

}

.order{

background:#2563EB;
color:white;

}

.home{

border:2px solid #2563EB;
color:#2563EB;

}

.order:hover{

.home:hover{

<b>KUU Mart</b>.

<div class="btn">
