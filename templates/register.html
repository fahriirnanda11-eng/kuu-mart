<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar - KUU Mart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#DBEAFE,#EFF6FF);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:900px;
background:white;
display:flex;
border-radius:25px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.1);
}

.left{
flex:1;
background:linear-gradient(135deg,#2563EB,#60A5FA);
color:white;
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.left h1{
font-size:42px;
margin-bottom:20px;
}

.left p{
line-height:30px;
}

.right{
flex:1;
padding:50px;
}

.right h2{
text-align:center;
margin-bottom:30px;
color:#1E293B;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.input-group input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
font-size:15px;
}

button{
width:100%;
padding:15px;
background:#2563EB;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1D4ED8;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
color:#2563EB;
text-decoration:none;
font-weight:bold;
}
.alert{

padding:12px;
margin-bottom:20px;
background:#DBEAFE;
color:#1D4ED8;
border-radius:10px;
font-weight:500;

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>Selamat Datang</h1>

<p>

Bergabunglah bersama KUU Mart dan nikmati pengalaman belanja yang mudah, aman, dan nyaman.

</p>

</div>

<div class="right">

<h2>Daftar Akun</h2>
{% if messages %}
    {% for message in messages %}
    <div class="alert">
        {{ message }}
    </div>
    {% endfor %}
{% endif %}

<form method="POST">

    {% csrf_token %}

    <div class="input-group">

        <label>Username</label>

        <input type="text" name="username" placeholder="Masukkan Username" required>

    </div>

    <div class="input-group">

        <label>Email</label>

        <input type="email" name="email" placeholder="Masukkan Email" required>

    </div>

    <div class="input-group">

        <label>Password</label>

        <input type="password" name="password" placeholder="Masukkan Password" required>

    </div>

    <button type="submit">

        Daftar Sekarang

    </button>

</form>

<div class="login-link">

    Sudah punya akun?

    <a href="{% url 'login' %}">

        Login

    </a>

</div>

</div>

</div>
</body>
</html>
